name: CI

on:
  pull_request:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  native-session-isolation:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Linux OS sandbox dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap socat ripgrep curl apparmor
      - name: Authorize only bubblewrap user namespaces on the disposable runner
        if: runner.os == 'Linux'
        run: |
          native_ci_userns=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || true)
          if [ "$native_ci_userns" = 1 ]; then
            sudo apparmor_parser -r scripts/ci-bwrap.apparmor
            test "$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)" = "$native_ci_userns"
          fi
          bwrap --unshare-user --unshare-net --unshare-pid --ro-bind / / --proc /proc --dev /dev -- /bin/true
      - name: Install macOS sandbox dependency
        if: runner.os == 'macOS'
        run: command -v rg || brew install ripgrep
      - name: Install pinned sandbox runtime without lifecycle scripts
        run: npm ci --prefix tools/native-sandbox --ignore-scripts --no-audit --no-fund
      - name: Verify real OS enforcement and both provider continuation paths
        run: |
          export OPENLINKER_TEST_NATIVE_SANDBOX_BIN="$PWD/tools/native-sandbox/node_modules/.bin/srt"
          bash scripts/test-native-session-isolation.sh

  test:
    runs-on: ubuntu-latest
    env:
      GOWORK: "off"
      GOFLAGS: "-mod=readonly"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node for boundary checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download dependencies
        run: go mod download

      - name: Verify dependency graph
        run: |
          go mod verify
          go list ./...

      - name: Test
        run: go test ./...

      - name: Test release build identity
        run: node --test scripts/build-agent-node.test.mjs

      - name: Check isolated adapter boundaries and negative controls
        run: |
          node scripts/generate-codex-rpc.mjs --check
          node --test scripts/check-adapter-boundaries.test.mjs
          node scripts/check-adapter-boundaries.mjs

      - name: Vet
        run: go vet ./...

      - name: Race test
        run: go test -race ./...

      - name: Build
        run: go build ./cmd/openlinker-agent-node
